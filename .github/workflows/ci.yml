name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Retrain from scratch (model, calibration, figures, leakage study)
        run: python train.py
      - name: Rebuild and execute the case-study notebook
        run: |
          python notebooks/build_notebook.py
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1200 \
            notebooks/Insurance_Claim_Risk_Case_Study.ipynb
      - name: Test suite (parity, calibration, provenance, leakage, API)
        run: pytest -q
